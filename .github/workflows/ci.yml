name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  verify:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Run unit tests
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Build reusable React package
        run: npm run build:react

      - name: Verify Next.js host consumer
        run: npm ci --prefix examples/next-host && npm run build --prefix examples/next-host

      - name: Build Storybook
        run: npm run build-storybook

  e2e:
    name: E2E Browser Tests
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: TEST_PRODUCTION=1 npx playwright test --retries=2

      - name: Build embedded consumer
        run: npm run build:react && npm ci --prefix examples/next-host && npm run build --prefix examples/next-host

      - name: Verify embedded workspace
        run: npx playwright test --config playwright.embedding.config.ts
